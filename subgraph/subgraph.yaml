specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: GovernorBravo
    network: mainnet
    source:
      address: "0x408ED6354d4973f66138C91495F2f2FCbd8724C3"
      abi: GovernorBravo
      startBlock: 18211425
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - NewAdmin
        - NewImplementation
        - NewPendingAdmin
        - ProposalCanceled
        - ProposalCreated
        - ProposalExecuted
        - ProposalQueued
        - ProposalThresholdSet
        - VoteCast
        - VotingDelaySet
        - VotingPeriodSet
      abis:
        - name: GovernorBravo
          file: ./abis/GovernorBravo.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
      file: ./src/governor-bravo.ts
